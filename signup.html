<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elyvance | Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mobile-menu { display: none; }
    .mobile-menu.open { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-white text-zinc-900 antialiased">

 <header
      class="sticky top-0 z-50 bg-white/80 backdrop-blur-md  border-b border-zinc-100"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center gap-6">
        <a
          href="index.html"
          class="text-xl font-bold tracking-tighter text-zinc-900 shrink-0"
          >ELYVANCE</a
        >

        <div
          class="flex  items-center gap-3 border border-gray-300/70 px-5 py-2.5 rounded-full max-w-sm bg-white/60"
        >
          <i
            class="fa-solid fa-magnifying-glass text-indigo-600 text-xs shrink-0"
          ></i>
          <input
            type="text"
            class="outline-none bg-transparent text-sm w-full search-bar"
            onkeyup="ProductFilter()"
            placeholder="Search products…"
          />
        </div>

        <nav class="hidden md:block shrink-0">
          <ul class="flex gap-7 text-sm font-medium items-center">
            <li>
              <a
                href="products.html"
                class="hover:text-black text-zinc-500 transition-colors"
                >Products</a
              >
            </li>
            <li>
              <a
                href="about-services.html"
                class="hover:text-black text-zinc-500 transition-colors"
                >Services</a
              >
            </li>
            <li>
              <a
                href="contact.html"
                class="hover:text-black text-zinc-500 transition-colors"
                >Contact</a
              >
            </li>
            <li>
              <a href="cart.html" class="relative">
                <i class="fa-solid fa-cart-shopping text-indigo-600"></i>
                <span
                  id="cartCount"
                  class="absolute -top-2 -right-2 text-xs font-bold text-indigo-600"
                ></span>
              </a>
            </li>
          </ul>
        </nav>

        <div
          class="hidden md:flex items-center gap-5 shrink-0 text-sm font-medium"
        >
          <a
            href="login.html"
            class="hover:text-black text-zinc-500 transition-colors"
            >Log In</a
          >
          <a
            href="signup.html"
            class="bg-indigo-500 text-white px-4 py-1.5 rounded-full font-semibold hover:bg-indigo-700 transition-colors"
            >Sign Up</a
          >
        </div>

        <div class="flex items-center gap-4 md:hidden ml-auto">
          <a href="cart.html" class="relative">
            <i class="fa-solid fa-cart-shopping text-indigo-600"></i>
            <span
              id="cartCountMobile"
              class="absolute -top-2 -right-2 text-xs font-bold text-indigo-600"
            ></span>
          </a>
          <button
            id="menuToggle"
            class="text-zinc-700 p-1"
            aria-label="Toggle menu"
          >
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
        </div>
      </div>

      <div
        id="mobileMenu"
        class="mobile-menu flex-col gap-0 border-t border-zinc-100 bg-white md:hidden"
      >
        <a
          href="products.html"
          class="px-6 py-3 text-sm border-b border-zinc-50 font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
          >Products</a
        >
        <a
          href="about-services.html"
          class="px-6 py-3 text-sm border-b border-zinc-50 font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
          >Services</a
        >
        <a
          href="contact.html"
          class="px-6 py-3 text-sm border-b border-zinc-50 font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
          >Contact</a
        >
        <div class="flex">
          <a
            href="login.html"
            class="flex-1 px-6 py-3 text-sm text-center border-b border-zinc-50 font-medium text-zinc-600 hover:text-black hover:bg-zinc-50 transition-colors"
            >Log In</a
          >
          <a
            href="signup.html"
            class="flex-1 px-6 py-3 text-sm font-bold text-center border-b border-zinc-50 text-white bg-indigo-600 hover:bg-indigo-700 transition-colors"
            >Sign Up</a
          >
        </div>
      </div>
    </header>

  <main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 sm:py-16 relative bg-slate-50/25">
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <div class="absolute top-0 left-1/3 w-[300px] sm:w-[500px] h-[300px] sm:h-[500px] bg-indigo-600/10 rounded-full blur-[80px] sm:blur-[120px]"></div>
      <div class="absolute bottom-0 right-1/3 w-[250px] sm:w-[400px] h-[250px] sm:h-[400px] bg-purple-600/5 rounded-full blur-[60px] sm:blur-[100px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-sm sm:max-w-md animate-fade-in">
      <div class="bg-white border border-zinc-100 rounded-2xl p-6 sm:p-8 shadow-xl shadow-black/5">
        <div class="text-center mb-6 sm:mb-8">
          <a href="index.html" class="text-xl font-bold tracking-tighter text-zinc-900 block mb-4 sm:hidden">ELYVANCE</a>
          <h2 class="text-xl sm:text-2xl font-bold text-black mb-1.5 sm:mb-2 tracking-tight">Create your account</h2>
          <p class="text-black/50 text-xs sm:text-sm">Get started with ELYVANCE today</p>
        </div>

        <form onsubmit="handleSignup(event)" class="space-y-4 sm:space-y-5">
          <div>
            <label for="name" class="block text-xs font-medium text-black/60 tracking-wider mb-1.5 sm:mb-2">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe"
              class="w-full px-4 py-3 bg-gray-100 border border-blue-400 rounded-xl text-zinc-700 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
          </div>
          <div>
            <label for="email" class="block text-xs font-medium text-black/60 tracking-wider mb-1.5 sm:mb-2">Email</label>
            <input type="email" id="email" required placeholder="you@example.com"
              class="w-full px-4 py-3 bg-gray-100 border border-blue-400 rounded-xl text-zinc-700 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
          </div>
          <div>
            <label for="password" class="block text-xs font-medium text-black/60 tracking-wider mb-1.5 sm:mb-2">Password</label>
            <input type="password" id="password" required minlength="8" placeholder="••••••••"
              class="w-full px-4 py-3 bg-gray-100 border border-blue-400 rounded-xl text-zinc-700 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
          </div>
          <div>
            <label for="confirmPassword" class="block text-xs font-medium text-black/60 tracking-wider mb-1.5 sm:mb-2">Confirm Password</label>
            <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••"
              class="w-full px-4 py-3 bg-gray-100 border border-blue-400 rounded-xl text-zinc-700 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
          </div>
          <div class="flex items-start gap-3 pt-1">
            <input type="checkbox" id="terms" required
              class="mt-0.5 w-4 h-4 rounded border-zinc-300 text-indigo-600 cursor-pointer shrink-0" />
            <label for="terms" class="text-xs sm:text-sm text-black/50 leading-relaxed cursor-pointer">
              I agree to the
              <a href="#" class="text-indigo-500 hover:text-indigo-700 transition-colors font-medium">Terms</a>
              and
              <a href="#" class="text-indigo-500 hover:text-indigo-700 transition-colors font-medium">Privacy Policy</a>
            </label>
          </div>
          <button type="submit"
            class="w-full py-3 sm:py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition-all duration-200 shadow-lg shadow-indigo-900/20 hover:-translate-y-0.5 active:translate-y-0 text-sm sm:text-base">
            Create Account
          </button>
        </form>

        <p class="text-center mt-6 sm:mt-8 text-xs sm:text-sm text-black/40">
          Already have an account?
          <a href="login.html" class="text-indigo-500 hover:text-indigo-700 transition-colors font-medium">Log in</a>
        </p>
      </div>
    </div>
  </main>

 <script>
  function handleSignup(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      alert('Make sure you input the same password to confirm your password');
    }else if(!isNaN(name)){
      alert("Your name must not be in number")

    }else {
      alert(`Welcome, ${name}! Your account has been created.`);
      window.location.href = 'login.html';
    }
  }
</script>
  <script src="index.js"></script>
</body>
</html>
